<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('natsurii-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Natsurii's Portfolio. Blog List">
  <title>Natsurii - Blogs</title>
  <!-- Open Graph / Social SEO -->
  <meta property="og:site_name" content="Natsurii">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://natsurii.pages.dev/blogs.html">
  <meta property="og:title" content="Natsurii - Blogs">
  <meta property="og:description" content="Natsurii's Portfolio. Blog List">
  <meta property="og:image" content="https://natsurii.pages.dev/assets/og/blogs.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Natsurii - Blogs">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Natsurii - Blogs">
  <meta name="twitter:description" content="Natsurii's Portfolio. Blog List">
  <meta name="twitter:image" content="https://natsurii.pages.dev/assets/og/blogs.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preload" href="assets/Px437_IBM_VGA_9x16.ttf" as="font" type="font/ttf">
  <link rel="icon" type="image/gif" href="assets/favicon.gif">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to Content</a>
  <nav class="sr-nav" aria-label="Main Navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blogs.html">Blogs</a>
  </nav>
  <header class="ascii-container" aria-hidden="true"></header>
  <main id="main" class="ascii-container blog-list-container">
    <h1 class="sr-only">Natsurii - Blogs</h1>
    <div class="blog-header-banner">
      C:\BLOGS\INDEX.LOG
    </div>
    <div id="blog-posts-loading" aria-live="polite">Loading blog entries…</div>
    <div id="blog-posts-list" aria-live="polite"></div>
  </main>
  <footer class="ascii-container" aria-hidden="true"></footer>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Load header and footer
    asciiToHTML('./components/header.utf8ans', 'header', 2, 5, function() {
        addHyperlinkToText('header', '<home>', 'index.html');
        addHyperlinkToText('header', '<about>', 'about.html');
        addHyperlinkToText('header', '<blogs>', 'blogs.html');
    });
    asciiToHTML('./components/footer.utf8ans', 'footer', 2, 5);

    // Fetch blog manifest and render list
    $.getJSON('./content/blogs/manifest.json')
      .done(function(posts) {
        $('#blog-posts-loading').hide();
        const listContainer = $('#blog-posts-list');
        if (!posts || posts.length === 0) {
          listContainer.html('<p>No blog posts found.</p>');
          return;
        }

        let html = '';
        posts.forEach(post => {
          html += `
            <div class="blog-post-card">
              <div class="blog-post-date"><time datetime="${post.date}">[${post.date}]</time></div>
              <h2 class="blog-post-title"><a href="blogs/${post.slug}.html">${post.title}</a></h2>
              <p class="blog-post-desc">${post.description}</p>
              <div class="blog-post-divider"></div>
            </div>
          `;
        });
        listContainer.html(html);
        fitAsciiLines();
      })
      .fail(function() {
        $('#blog-posts-loading').text('Error: Could not load blog manifest. Check your connection and reload the page.');
      });
  });
  </script>
</body>
</html>
