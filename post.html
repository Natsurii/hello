<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Natsurii's Portfolio. Blog Post">
  <title>Natsurii - Blog Post</title>
  <link rel="icon" type="image/gif" href="assets/favicon.gif">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
</head>
<body>
  <header class="ascii-container"></header>
  <main class="ascii-container markdown-container">
    <div class="blog-nav-top">
      <a href="blogs.html">&lt;-- [back to blogs]</a>
      <hr class="retro-hr">
    </div>
    <div id="post-loading">Loading post content...</div>
    <div id="post-content"></div>
    <div class="blog-nav-bottom">
      <hr class="retro-hr">
      <a href="blogs.html">&lt;-- [back to blogs]</a>
    </div>
  </main>
  <footer class="ascii-container"></footer>

  <script>
  $(document).ready(function () {
    // Load header and footer
    asciiToHTML('./components/header.utf8ans', 'header', 2, 5, function() {
        addHyperlinkToText('header', '<home>', 'index.html');
        addHyperlinkToText('header', '<about>', 'about.html');
        addHyperlinkToText('header', '<blogs>', 'blogs.html');
    });
    asciiToHTML('./components/footer.utf8ans', 'footer', 2, 5);

    // Get slug from query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    if (!slug) {
      $('#post-loading').text('Error: No blog post specified.');
      return;
    }

    // Validate slug structure: only lowercase letters, digits, and hyphens.
    // Blocks path traversal (../), absolute paths (/), and URL tricks.
    const SLUG_RE = /^[a-z0-9][a-z0-9-]{0,127}$/;
    if (!SLUG_RE.test(slug)) {
      $('#post-loading').text('Error: Invalid post identifier.');
      return;
    }

    // Whitelist slug against the manifest before fetching any markdown.
    $.getJSON('./content/blogs/manifest.json')
      .done(function(posts) {
        const known = Array.isArray(posts)
          ? posts.some(p => p && p.slug === slug)
          : false;
        if (!known) {
          $('#post-loading').text('Error: Blog post not found.');
          return;
        }
        fetchPost(slug);
      })
      .fail(function() {
        $('#post-loading').text('Error: Could not load blog manifest.');
      });
  });

  function fetchPost(slug) {
    // Fetch markdown file (slug is already validated + whitelisted)
    $.get(`./content/blogs/${slug}.md`)
      .done(function(markdownText) {
        $('#post-loading').hide();
        const htmlContent = parseMarkdown(markdownText);
        $('#post-content').html(htmlContent);
        Prism.highlightAll();
        fitAsciiLines();
        $('#post-content img').on('load', fitAsciiLines);
      })
      .fail(function() {
        $('#post-loading').text('Error: Blog post not found.');
      });
  }
  </script>
</body>
</html>
