<body>
  <a class="skip-link" href="#main">Skip to Content</a>
  <nav class="sr-nav" aria-label="Main Navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blogs.html">Blogs</a>
    <a href="contact.html">Contact</a>
  </nav>
  <header class="ascii-container" aria-hidden="true"></header>
  <main id="main" class="ascii-container blog-list-container markdown-container">
    <h1 class="sr-only">Natsurii - Contact</h1>
    <div id="post-content">
      <div class="blog-header-banner">C:\CONTACT\INDEX.LOG</div>
      <h2>Contact</h2>
      <p>Have a question, a project in mind, or just want to say hi? Transmit a message below &mdash; it lands directly in my inbox.</p>
      <div id="contact-status" class="contact-status" aria-live="polite">&gt; awaiting transmission&hellip;</div>
      <form id="contact-form" class="contact-form" novalidate>
        <label for="cf-name">name:</label>
        <input type="text" id="cf-name" name="name" maxlength="200" required autocomplete="name">
        <label for="cf-email">email:</label>
        <input type="email" id="cf-email" name="email" maxlength="200" required autocomplete="email">
        <label for="cf-message">message:</label>
        <textarea id="cf-message" name="message" rows="6" maxlength="2000" required></textarea>
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAE80xK1gPVJABtJv"></div>
        <button type="submit" id="cf-submit">[ TRANSMIT ]</button>
      </form>
    </div>
  </main>
  <footer class="ascii-container" aria-hidden="true"></footer>

  <!-- CSP violation >:D -->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    asciiToHTML('./components/header.utf8ans', 'header', 2, 5, function() {
        addHyperlinkToText('header', '<home>', 'index.html');
        addHyperlinkToText('header', '<about>', 'about.html');
        addHyperlinkToText('header', '<blogs>', 'blogs.html');
        addHyperlinkToText('header', '<contact>', 'contact.html');
    });
    asciiToHTML('./components/footer.utf8ans', 'footer', 2, 5);

    var form = document.getElementById('contact-form');
    var status = document.getElementById('contact-status');
    var btn = document.getElementById('cf-submit');
    var turnstileToken = '';

    var widget = form.querySelector('.cf-turnstile');
    var sitekey = widget.getAttribute('data-sitekey');
    if (sitekey && window.turnstile) {
      turnstile.render(widget, {
        sitekey: sitekey,
        callback: function (token) { turnstileToken = token; },
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      status.textContent = '> transmitting\u2026';
      fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.elements['name'].value,
          email: form.elements['email'].value,
          message: form.elements['message'].value,
          website: form.elements['website'].value,
          turnstile: turnstileToken,
        }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            status.textContent = "> OK \u2014 message delivered. I'll get back to you soon.";
            form.reset();
            turnstileToken = '';
          } else {
            status.textContent = '> ERR \u2014 ' + (d.error || 'something went wrong') + ' Try again.';
          }
        })
        .catch(function () {
          status.textContent = '> ERR \u2014 network failure. Check your connection and try again.';
        })
        .finally(function () {
          btn.disabled = false;
        });
    });
  });
  </script>
  <!-- End of CSP violation -->
</body>
</html>
